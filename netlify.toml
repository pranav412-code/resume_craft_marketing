# Krafiter marketing site (Next.js) — https://krafiter.com
# Primary domain on Netlify: krafiter.com
# Old hosts (resumecraft.*) 301 to krafiter.com below.

[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "20"
  NEXT_PUBLIC_SITE_URL = "https://krafiter.com"
  NEXT_PUBLIC_APP_URL = "https://app.krafiter.com"
  NEXT_PUBLIC_API_URL = "https://resume-craft-backend-1r57.onrender.com"
  # NEXT_PUBLIC_* vars are public by design — exclude from Netlify secrets scanner.
  SECRETS_SCAN_OMIT_KEYS = "NEXT_PUBLIC_SITE_URL,NEXT_PUBLIC_API_URL,NEXT_PUBLIC_APP_URL"

[[plugins]]
  package = "@netlify/plugin-nextjs"

# Legacy ResumeCraft hosts → Krafiter canonical.
[[redirects]]
  from = "/*"
  to = "https://krafiter.com/:splat"
  status = 301
  force = true
  conditions = {Host = ["resumecraft.site"]}

[[redirects]]
  from = "/*"
  to = "https://krafiter.com/:splat"
  status = 301
  force = true
  conditions = {Host = ["www.resumecraft.site"]}

[[redirects]]
  from = "/*"
  to = "https://krafiter.com/:splat"
  status = 301
  force = true
  conditions = {Host = ["resumecraft.app"]}

[[redirects]]
  from = "/*"
  to = "https://krafiter.com/:splat"
  status = 301
  force = true
  conditions = {Host = ["www.resumecraft.app"]}

[[redirects]]
  from = "/*"
  to = "https://krafiter.com/:splat"
  status = 301
  force = true
  conditions = {Host = ["www.krafiter.com"]}
