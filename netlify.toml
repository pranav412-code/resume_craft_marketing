# Krafiter marketing site (Next.js) — https://krafiter.com
# Primary domain on Netlify: krafiter.com
# Old hosts must remain as domain aliases on this same site for redirects to fire.
#
# NOTE: Netlify does NOT support Host= conditions on redirects.
# Use absolute-URL "from" patterns (domain-level redirects) instead.

[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "20"
  NEXT_PUBLIC_SITE_URL = "https://krafiter.com"
  NEXT_PUBLIC_APP_URL = "https://app.krafiter.com"
  NEXT_PUBLIC_API_URL = "https://resume-craft-backend-1r57.onrender.com"
  # Analytics. These are inlined at BUILD time — components/seo/Analytics.tsx
  # renders nothing (and the site stays zero-JS) whenever they are unset, so a
  # missing value here means no measurement in production at all.
  # Set the real values in the Netlify UI so deploy previews can differ; the
  # keys must still be listed in SECRETS_SCAN_OMIT_KEYS below.
  # NEXT_PUBLIC_PLAUSIBLE_DOMAIN = "krafiter.com"
  # NEXT_PUBLIC_GA4_MEASUREMENT_ID = "G-XXXXXXXXXX"
  # NEXT_PUBLIC_* vars are public by design — exclude from Netlify secrets scanner.
  SECRETS_SCAN_OMIT_KEYS = "NEXT_PUBLIC_SITE_URL,NEXT_PUBLIC_API_URL,NEXT_PUBLIC_APP_URL,NEXT_PUBLIC_PLAUSIBLE_DOMAIN,NEXT_PUBLIC_GA4_MEASUREMENT_ID,NEXT_PUBLIC_GOOGLE_SITE_VERIFICATION"

[[plugins]]
  package = "@netlify/plugin-nextjs"

# Deploy previews and branch deploys are live on crawlable *.netlify.app hosts.
# app/robots.ts also disallows them, but X-Robots-Tag is the per-response
# signal and covers non-HTML assets too.
[[context.deploy-preview.headers]]
  for = "/*"
  [context.deploy-preview.headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[context.branch-deploy.headers]]
  for = "/*"
  [context.branch-deploy.headers.values]
    X-Robots-Tag = "noindex, nofollow"

# Legacy ResumeCraft hosts → Krafiter canonical (force=true shadows Next.js pages).
[[redirects]]
  from = "https://resumecraft.site/*"
  to = "https://krafiter.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://resumecraft.site"
  to = "https://krafiter.com/"
  status = 301
  force = true

[[redirects]]
  from = "https://www.resumecraft.site/*"
  to = "https://krafiter.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://www.resumecraft.site"
  to = "https://krafiter.com/"
  status = 301
  force = true

[[redirects]]
  from = "https://resumecraft.app/*"
  to = "https://krafiter.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://resumecraft.app"
  to = "https://krafiter.com/"
  status = 301
  force = true

[[redirects]]
  from = "https://www.resumecraft.app/*"
  to = "https://krafiter.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://www.resumecraft.app"
  to = "https://krafiter.com/"
  status = 301
  force = true

[[redirects]]
  from = "https://www.krafiter.com/*"
  to = "https://krafiter.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://www.krafiter.com"
  to = "https://krafiter.com/"
  status = 301
  force = true
